name: Build and Release

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'

jobs:
  build:
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Get release version
        id: get_version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Check release version
        run: echo "Release version is ${{ steps.get_version.outputs.version }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        # 构建链本身就是 devDependencies：js-confuser（混淆）与 @babel/parser（静态闸门）都在
        # devDependencies 里，`--production` 会把它们整段跳过，构建必然在 import 阶段失败。
        # 本镜像又自带全局 tsc，会让 `npm run check` 在缺本地 typescript 时照样显示成功，
        # 把问题一路掩盖到构建阶段——所以这里显式 --include=dev，再用 ensure-deps 复查一次：
        # 一旦发现缺包就自己执行 npm install --include=dev 补齐（scripts/build.js 里还会再查）。
        run: |
          npm install --include=dev --no-audit --no-fund
          npm run ensure-deps

      - name: Type check
        run: npm run check
        
      - name: Build project
        run: npm run build

      - name: Read release note
        id: read_release
        shell: bash
        run: |
          r=$(cat RELEASE.md)         
          r="${r//'%'/'%25'}"                               
          r="${r//$'\n'/'%0A'}"                             
          r="${r//$'\r'/'%0D'}"                             
          echo "RELEASE_BODY=$r" >> $GITHUB_OUTPUT          

      - name: Upload Release Assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          tag: v${{ steps.get_version.outputs.version }}
          release_name: Release v${{ steps.get_version.outputs.version }}
          overwrite: true
          file_glob: true
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          promote: ${{ github.ref == 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          body: ${{ steps.read_release.outputs.RELEASE_BODY }}
