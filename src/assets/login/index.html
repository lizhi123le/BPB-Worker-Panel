<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=login,visibility,visibility_off&display=block"
        rel="stylesheet" />
    __STYLE__
</head>

<body class="has-fallback" data-auth-mode="__AUTH_MODE__">
    <iframe id="fallback-bg" src="/img?t=1" title="fallback background" aria-hidden="true"></iframe>
    <div class="container">
        <h1>
            <!-- F14：登录页未鉴权可达，不渲染项目版本 -->
            <img class="icon" src="/favicon.ico" alt="BPB Logo"> BPB Panel
        </h1>
        <div class="form-container">
            <h2 id="formTitle">User Login</h2>
            <form id="loginForm" class="login-form">
                <div class="form-control">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required>
                        <span class="material-symbols-rounded toggle-password">
                            visibility_off
                        </span>
                    </div>
                </div>
                <div id="passwordError" class="hint"></div>
                <button type="submit" class="button">
                    Login
                    <span class="material-symbols-rounded">
                        login
                    </span>
                </button>
            </form>
            <!-- 首访（KV 尚无管理员口令）：服务端把 __AUTH_MODE__ 换成 setup，CSS 据此显示这张表单 -->
            <form id="setupForm" class="login-form">
                <div class="form-control">
                    <label for="newPassword">New password</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required>
                        <span class="material-symbols-rounded toggle-password">
                            visibility_off
                        </span>
                    </div>
                </div>
                <div class="form-control">
                    <label for="confirmPassword">Confirm password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
                        <span class="material-symbols-rounded toggle-password">
                            visibility_off
                        </span>
                    </div>
                </div>
                <div class="hint hint-info">
                    Password must contain at least one capital letter, one number, and be at least 8 characters long.
                </div>
                <div id="setupError" class="hint"></div>
                <button type="submit" class="button">
                    Set password
                    <span class="material-symbols-rounded">
                        login
                    </span>
                </button>
            </form>
        </div>
    </div>
    <script>__SCRIPT__</script>
</body>

</html>
