<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --color-bg-main: linear-gradient(90deg, #000328, #00458E);
            --color-text-primary: #f1f5f9;
            --color-text-secondary: #aec4e2;
            --shadow-header: 0.125rem 0.125rem 0.25rem #000328;
            --space-sm: 0.5rem;
        }

        body,
        html {
            height: 100%;
            width: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Ubuntu", system-ui;
            color: var(--color-text-secondary);
            background: var(--color-bg-main);
            text-align: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1 {
            color: var(--color-text-primary);
            text-shadow: var(--shadow-header);
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: var(--space-sm);
        }

        .icon {
            height: 2.5rem;
        }

        /* R-10：伪装背景样式（body.has-fallback / #fallback-bg）已抽到 assets/common/base.css，
           由构建期在此处注入 —— 本页原先与另外 4 个页面各有一份逐字副本。 */
__BASE_STYLE__
    </style>
</head>

<body class="has-fallback">
    <iframe id="fallback-bg" src="/img?t=1" title="fallback background" aria-hidden="true"></iframe>
    <div id="error-container">
        <h1>
            <!-- F14：错误页未鉴权可达，不渲染项目版本 -->
            <img class="icon" src="/favicon.ico" alt="BPB Logo"> BPB Panel
        </h1>
        <div>
            <h2>❌ Something went wrong!</h2>
            <p>
                <b>__ERROR_MESSAGE__</b>
            </p>
        </div>
    </div>
    <script>
        (function initFallbackBg() {
            var bg = document.getElementById('fallback-bg');
            if (bg) {
                bg.src = '/img?t=' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
            }
        })();
    </script>
</body>

</html>
