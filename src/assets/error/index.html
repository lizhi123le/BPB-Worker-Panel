<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BPB Panel v__VERSION__</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --color-bg-main: linear-gradient(90deg, #000328, #00458E);
            --color-text-primary: #f1f5f9;
            --color-text-secondary: #aec4e2;
            --shadow-header: 0.125rem 0.125rem 0.25rem #000328;
            --space-sm: 0.5rem;
        }

        body,
        html {
            height: 100%;
            width: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Ubuntu", system-ui;
            color: var(--color-text-secondary);
            background: var(--color-bg-main);
            text-align: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1 {
            color: var(--color-text-primary);
            text-shadow: var(--shadow-header);
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: var(--space-sm);
        }

        .icon {
            height: 2.5rem;
        }

        /* 伪装背景 iframe 垫底：整页铺满，内容浮于其上 */
        body.has-fallback {
            background: transparent;
        }

        body.has-fallback > * {
            position: relative;
            z-index: 2;
        }

        body.has-fallback::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: var(--color-bg-main);
            opacity: 0.72;
        }

        #fallback-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100vw;
            height: 100vh;
            border: 0;
            pointer-events: none;
            object-fit: fill;
            background: var(--color-bg-main);
        }
    </style>
</head>

<body class="has-fallback">
    <iframe id="fallback-bg" src="/img?t=1" title="fallback background" aria-hidden="true"></iframe>
    <div id="error-container">
        <h1>
            <img class="icon" src="/favicon.ico" alt="BPB Logo"> BPB Panel <span id="panel-version"
                style="font-size: smaller;">
                v__VERSION__
            </span>
        </h1>
        <div>
            <h2>❌ Something went wrong!</h2>
            <p>
                <b>__ERROR_MESSAGE__</b>
            </p>
        </div>
    </div>
    <script>
        (function initFallbackBg() {
            var bg = document.getElementById('fallback-bg');
            if (bg) {
                bg.src = '/img?t=' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
            }
        })();
    </script>
</body>

</html>
